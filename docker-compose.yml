# ============================================================
# PFE2026 - Docker Compose with Redis cache + Qdrant
# ============================================================

services:

  # API Gateway / FastAPI app
  api:
    build: .
    container_name: pfe2026_api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - redis
      - qdrant
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Celery worker for research tasks
  worker:
    build: .
    container_name: pfe2026_worker
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - redis
      - qdrant
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Redis — cache + Celery broker + result backend
  redis:
    image: redis:7-alpine
    container_name: pfe2026_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # Vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pfe2026_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  qdrant_storage:
    driver: local