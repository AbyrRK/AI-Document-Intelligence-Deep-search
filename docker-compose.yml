version: '3.8'

services:
  # ============================================================
  # 1. VOTRE API FASTAPI
  # ============================================================
  api:
    build: .
    container_name: pfe_api
    ports:
      - "8000:8000"
    environment:
      # Base de données
      DATABASE_URL: postgresql://postgres:password@postgres:5432/pfedb
      # Qdrant (utilise le nom du service comme hostname)
      QDRANT_URL: http://qdrant:6333
      # Redis
      REDIS_URL: redis://redis:6379/0
      # Clés API (à remplacer par les vraies valeurs ou .env)
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      # Tesseract est déjà dans le container (voir Dockerfile)
      TESSERACT_PATH: /usr/bin/tesseract
    volumes:
      # Persistance des uploads temporaires
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - pfe_network

  # ============================================================
  # 2. WORKER CELERY (Traitement async des gros fichiers)
  # ============================================================
  celery-worker:
    build: .
    container_name: pfe_celery
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/pfedb
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      TESSERACT_PATH: /usr/bin/tesseract
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - redis
      - postgres
      - api
    restart: unless-stopped
    networks:
      - pfe_network

  # ============================================================
  # 3. BASE VECTORIELLE QDRANT
  # ============================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pfe_qdrant
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC (optionnel)
    volumes:
      # Persistance des vecteurs même si le container redémarre
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - pfe_network

  # ============================================================
  # 4. CACHE / FILE D'ATTENTE REDIS
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: pfe_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - pfe_network

  # ============================================================
  # 5. BASE DE DONNÉES POSTGRESQL
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: pfe_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pfedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pfe_network

# ============================================================
# VOLUMES (Stockage persistant)
# ============================================================
volumes:
  qdrant_storage:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ============================================================
# RÉSEAU (Communication entre containers)
# ============================================================
networks:
  pfe_network:
    driver: bridge